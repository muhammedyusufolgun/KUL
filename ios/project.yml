name: SoruHazirlamaAsistani
options:
  bundleIdPrefix: com.olgun
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  SoruHazirlamaAsistani:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SoruHazirlamaAsistani
        excludes:
          - Web/**
      - path: SoruHazirlamaAsistani/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olgun.soruhazirlamaasistani
        INFOPLIST_FILE: SoruHazirlamaAsistani/Info.plist
        PRODUCT_NAME: SoruHazirlamaAsistani
        SWIFT_EMIT_LOC_STRINGS: YES
