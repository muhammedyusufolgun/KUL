name: Ramak Kala Android APK
on:
  push:
    branches: [ramak-kala-android]
    paths:
      - 'ramak-kala/**'
      - '.github/workflows/ramak-kala-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed debug APK
        working-directory: ramak-kala
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK=ramak-kala/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Ramak-Kala.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ramak-Kala-APK
          path: Ramak-Kala.apk
          if-no-files-found: error
