name: Build Soru-Hazirlama-Asistani APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp quiz-fixes.js www/quiz-fixes.js
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Soru Hazırla" "com.asistan.soruhazirlama" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Test answer matching, OCR question validation and repeated test operations
        run: |
          npm install --no-save --no-package-lock jsdom@24
          node --check quiz-fixes.js
          node tests/quiz.test.cjs
          grep -q 'id="homeHeader"' www/index.html
          grep -q 'Kayıtlı Testler' www/quiz-fixes.js
          test -s www/quiz-fixes.js
          grep -q 'src="quiz-fixes.js"' www/index.html
      - name: Set app name and custom launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          root = Path("android/app/src/main/res")
          yellow = "#FEF9C3"
          black = "#111111"
          # Full icon used by older Android launchers.
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              d = root / ("mipmap-" + density)
              d.mkdir(parents=True, exist_ok=True)
              im = Image.new("RGB",(size,size),yellow)
              draw = ImageDraw.Draw(im)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(size*0.31))
              except OSError:
                  font = ImageFont.load_default()
              label = "Soru"
              box = draw.textbbox((0,0),label,font=font,stroke_width=0)
              x=(size-(box[2]-box[0]))/2
              y=(size-(box[3]-box[1]))/2-box[1]
              draw.text((x,y),label,font=font,fill=black)
              im.save(d/"ic_launcher.png")
              im.save(d/"ic_launcher_round.png")
              fgsize=int(size*2.25)
              fg=Image.new("RGBA",(fgsize,fgsize),(0,0,0,0))
              fgdraw=ImageDraw.Draw(fg)
              try:
                  fgfont=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",int(fgsize*0.20))
              except OSError:
                  fgfont=ImageFont.load_default()
              fb=fgdraw.textbbox((0,0),"Soru",font=fgfont)
              fx=(fgsize-(fb[2]-fb[0]))/2
              fy=(fgsize-(fb[3]-fb[1]))/2-fb[1]
              fgdraw.text((fx,fy),"Soru",font=fgfont,fill=black)
              fg.save(d/"ic_launcher_foreground.png")
          # Override Android 8+ adaptive icon XML so its foreground uses the black S.
          anydpi=root/"mipmap-anydpi-v26"
          anydpi.mkdir(parents=True,exist_ok=True)
          adaptive='<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'
          (anydpi/"ic_launcher.xml").write_text(adaptive)
          (anydpi/"ic_launcher_round.xml").write_text(adaptive)
          # Adaptive icon foreground; Android applies the yellow background below.
          d = root / "drawable"
          d.mkdir(parents=True, exist_ok=True)
          size=432
          im=Image.new("RGBA",(size,size),(0,0,0,0))
          draw=ImageDraw.Draw(im)
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",92)
          label="Soru"
          box=draw.textbbox((0,0),label,font=font)
          x=(size-(box[2]-box[0]))/2
          y=(size-(box[3]-box[1]))/2-box[1]
          draw.text((x,y),label,font=font,fill=black)
          im.save(d/"ic_launcher_foreground.png")
          values = root / "values"
          values.mkdir(parents=True,exist_ok=True)
          bg = values / "ic_launcher_background.xml"
          bg.write_text(f'<resources><color name="ic_launcher_background">{yellow}</color></resources>')
          strings=values/"strings.xml"
          if strings.exists():
              txt=strings.read_text()
              import re
              if re.search(r'<string name="app_name">.*?</string>',txt):
                  txt=re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Soru Hazırla</string>',txt)
              else:
                  txt=txt.replace("</resources>",'<string name="app_name">Soru Hazırla</string></resources>')
              strings.write_text(txt)
          else:
              strings.write_text('<resources><string name="app_name">Soru Hazırla</string></resources>')
          PY
      - name: Verify pale yellow Soru launcher icon and application label
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path("android/app/src/main/res")
          icon=Image.open(root/"mipmap-xxxhdpi"/"ic_launcher.png").convert("RGB")
          assert icon.getpixel((0,0))==(254,249,195), "Icon background must be pale yellow"
          assert any(max(icon.getpixel((x,y))) < 85 for x in range(40,150,5) for y in range(55,130,5)), "Soru lettering missing"
          strings=ET.parse(root/"values"/"strings.xml").getroot()
          assert any(node.attrib.get("name")=="app_name" and node.text=="Soru Hazırla" for node in strings), "Wrong launcher caption"
          print("Pale yellow launcher with Soru lettering and Soru Hazırla label verified")
          PY
      - name: Keep Android WebView colors in light mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android:forceDarkAllowed=" not in s:
              s = s.replace("<application", '<application android:forceDarkAllowed="false"', 1)
          p.write_text(s)
          print("Android WebView force-dark disabled")
          PY
      - name: Resolve Kotlin duplicate classes
        run: |
          printf '\nconfigurations.configureEach { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" }\n' >> android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Soru-Hazirlama-Asistani.apk
      - name: Verify APK exists
        run: test -s Soru-Hazirlama-Asistani.apk
      - name: Sign and verify APK with Android apksigner (v1 v2 v3)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)"
          echo "Android SDK: $SDK_ROOT"
          echo "apksigner: ${APKSIGNER:-not found}"
          if [ -z "$APKSIGNER" ]; then
            echo "Warning: apksigner unavailable; using Gradle's signed debug APK."
          else
            KS="$HOME/.android/debug.keystore"
            if [ ! -f "$KS" ]; then
              KS="$RUNNER_TEMP/soru-asistani-debug.keystore"
              keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
            fi
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out signed-final.apk Soru-Hazirlama-Asistani.apk
            "$APKSIGNER" verify --verbose --print-certs signed-final.apk
            mv signed-final.apk Soru-Hazirlama-Asistani.apk
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soru-Hazirlama-Asistani
          path: Soru-Hazirlama-Asistani.apk
          if-no-files-found: error
          retention-days: 14
