name: Build Soru-Hazirlama-Asistani APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Soru Hazırlama Asistanı" "com.asistan.soruhazirlama" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Set app name and custom launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          root = Path("android/app/src/main/res")
          yellow = "#FACC15"
          black = "#111111"
          # Full icon used by older Android launchers.
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              d = root / ("mipmap-" + density)
              d.mkdir(parents=True, exist_ok=True)
              im = Image.new("RGB",(size,size),yellow)
              draw = ImageDraw.Draw(im)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(size*0.29))
              except OSError:
                  font = ImageFont.load_default()
              label = "S"
              box = draw.textbbox((0,0),label,font=font,stroke_width=0)
              x=(size-(box[2]-box[0]))/2
              y=(size-(box[3]-box[1]))/2-box[1]
              draw.text((x,y),label,font=font,fill=black)
              im.save(d/"ic_launcher.png")
              im.save(d/"ic_launcher_round.png")
          # Adaptive icon foreground; Android applies the yellow background below.
          d = root / "drawable"
          d.mkdir(parents=True, exist_ok=True)
          size=432
          im=Image.new("RGBA",(size,size),(0,0,0,0))
          draw=ImageDraw.Draw(im)
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",120)
          label="S"
          box=draw.textbbox((0,0),label,font=font)
          x=(size-(box[2]-box[0]))/2
          y=(size-(box[3]-box[1]))/2-box[1]
          draw.text((x,y),label,font=font,fill=black)
          im.save(d/"ic_launcher_foreground.png")
          values = root / "values"
          values.mkdir(parents=True,exist_ok=True)
          bg = values / "ic_launcher_background.xml"
          bg.write_text(f'<resources><color name="ic_launcher_background">{yellow}</color></resources>')
          strings=values/"strings.xml"
          if strings.exists():
              txt=strings.read_text()
              import re
              if re.search(r'<string name="app_name">.*?</string>',txt):
                  txt=re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Soru Hazırlama Asistanı</string>',txt)
              else:
                  txt=txt.replace("</resources>",'<string name="app_name">Soru Hazırlama Asistanı</string></resources>')
              strings.write_text(txt)
          else:
              strings.write_text('<resources><string name="app_name">Soru Hazırlama Asistanı</string></resources>')
          PY
      - name: Keep Android WebView colors in light mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android:forceDarkAllowed=" not in s:
              s = s.replace("<application", '<application android:forceDarkAllowed="false"', 1)
          p.write_text(s)
          print("Android WebView force-dark disabled")
          PY
      - name: Resolve Kotlin duplicate classes
        run: |
          printf '\nconfigurations.configureEach { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" }\n' >> android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Soru-Hazirlama-Asistani.apk
      - name: Verify APK exists
        run: test -s Soru-Hazirlama-Asistani.apk
      - name: Sign and verify APK with Android apksigner (v1 v2 v3)
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -f "$HOME/.android/debug.keystore"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out signed-final.apk Soru-Hazirlama-Asistani.apk
          "$APKSIGNER" verify --verbose --print-certs signed-final.apk
          mv signed-final.apk Soru-Hazirlama-Asistani.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soru-Hazirlama-Asistani
          path: Soru-Hazirlama-Asistani.apk
          if-no-files-found: error
          retention-days: 14
