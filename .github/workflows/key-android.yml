name: Key Android APK

on:
  push:
    branches: [key-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Check HTML and JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET
          html = Path('Key_Android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.buf=[]; self.items=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.active=True; self.buf=[]
              def handle_endtag(self, tag):
                  if tag == 'script' and self.active: self.items.append(''.join(self.buf)); self.active=False
              def handle_data(self, data):
                  if self.active: self.buf.append(data)
          parser = Scripts(); parser.feed(html)
          assert parser.items, 'No script found in packaged HTML'
          assert 'advancedDetails' not in html and 'Birden fazla yöntem' not in html
          assert 'requestNativeOcr' in html and 'onNativeOcrResult' in html
          assert 'textImagePreview' in html and 'titleTarget' in html and 'exitBtn' in html
          assert 'continueImage' not in html and 'imageDownload' in html
          Path('/tmp/key-inline.js').write_text('\n'.join(parser.items), encoding='utf-8')
          ET.parse('Key_Android/app/src/main/AndroidManifest.xml')
          PY
          node --check /tmp/key-inline.js
      - name: Build and run unit tests
        working-directory: Key_Android
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: Add Android build tools to PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Verify APK signature and package
        run: |
          APK=Key_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"
          apkanalyzer apk summary "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Key-APK
          path: Key_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
