name: Key Android APK

on:
  push:
    branches: [key-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build and run unit tests
        working-directory: Key_Android
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: Verify APK signature and package
        run: |
          APK=Key_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"
          apkanalyzer apk summary "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Key-APK
          path: Key_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
